id: CHG-53-DEF
procedure: CHG-53
sections:
  - {id: signatures, fields: [executive_cosign, client, contractor_pm]}
clarification_prompts:
  - id: concealed_conditions
    prompt: Concealed conditions
    default: {disposition: excluded, text: "Example Builders excludes hidden conditions found on opening; they are priced separately."}
  - {id: permits, prompt: Permits}
permit_trades: [electrical]
header_identity:
  - {label: Registration, path: licenses.contractor_registration}
depends_on:
  - {id: AUTH-WRITTEN, applies_when: always}
  - {id: BILL-SUPPORTED, applies_when: always}
  - {id: MARKUP-STRUCTURE, applies_when: always}
  - {id: MARKUP-PRESENTATION, applies_when: always}
  - {id: PCO-VALIDITY, applies_when: always}
  - {id: company.name, applies_when: always}
  - {id: role.Executive, applies_when: always}
  - {id: LABOR-BILLING-RATES, applies_when: cost_lines include labor}
  - {id: TAX-TREATMENT, applies_when: cost_lines include materials}
  - {id: PERMIT-TREATMENT, applies_when: cost_lines include permits_and_fees}
  - {id: GC-WEEKLY-RATES, applies_when: schedule_extension_percent_of_duration > GC-EXTENSION-THRESHOLD}
  - {id: APPROVAL-SPEND, applies_when: subcontractor_commitment, audience: internal}
  - {id: PRO-34, applies_when: owner_selection_present}
inputs:
  required: [project, change_description, reason, scope_inclusions]
  asked_if_missing: [schedule_extension_days, quotes, quantities, architect_signs]
cause_categories: [Owner-Directed, Field Condition]
presentation:                    # fictional wording, so tests prove the PCO reads what the package says
  terms: {contractor: the Contractor, owner: the Owner, contract: the Contract}
  number_style: "six (6)"
  category_labels: {labor: Own crew, subcontractors: Trade partner, materials: Materials, equipment: Equipment, general_conditions: General conditions, permits_and_fees: Permits and fees}
  basis_phrases:
    hours_x_rate: "{quantity} hours at the house rate"
    weeks_x_rate: "{quantity} weeks at the house weekly rate"
    rate_x_duration: "{quantity} {unit} at the house rate"
    estimate: fixed price
    actual_fee: at cost
  markup_basis:
    company: "House markup: {rates}, on the direct-cost subtotal."
    contract: "Markup per {reference}: {rates}, on the direct-cost subtotal, not compounded."
    pass_through: " Fees pass through at cost."
  trade_parties: {electrical: electrician, carpentry: carpenter}
  total_labels: {add: "Change total: add", deduct: "Change total: deduct"}
  description_opening:
    applies_to: [Owner-Directed]
    known: "As the Owner asked (per {record}), "
    unknown: "As the Owner asked (per [email / meeting] dated [date]), "
    continues_with: the Contractor proposes
  schedule_no_change:
    impact: No change to the completion date
    sentence: "No schedule impact, if authorized by {date} so the trades stay in sequence."
  exhibits:
    standard:
      - {id: layout_or_drawings, title: Layout or drawings, input_kind: drawing, owner_facing: true, applies_when: requested}
    requested_not_supplied: "{title}: supply one if the Owner should see it."
  backup:
    quote: "Written quote on file: {Party}'s quote"
    correspondence: "Request on file: how and when the Owner asked."
  selection:
    approved: "{items} per Owner Selection {id}, approved {date}."
    approved_as_noted: "{items} per Owner Selection {id}, approved as noted, {date}."
    issued_with_pco: "{items} per Owner Selection {id}, issued with this PCO for the Owner's signature."
    not_approved: "{items} per Owner Selection {id}, [approved on (date) / issued with this PCO]."
    unknown: "{items} per Owner Selection [ID], [approved on (date) / issued with this PCO]."
    question: "Which Owner Selection covers {items}, and is it approved?"
    not_approved_question: "Owner Selection {id} is {status}. Get it approved, or issue it with this PCO."
    confirm_notes: "Confirm the notes on Owner Selection {id} are reflected in this PCO."
  internal_note: Note for the PM
  signature_titles:
    executive_cosign: "{company}"
    client: Owner
    architect_if_required: Architect (if required by contract)
    architect: Architect
    contractor_pm: Prepared by
checklist:
  before_sending: [header.owner, header.project_address, header.pco_number, header.project, backup.quote, selection, selection.notes, permit, contract_terms_not_applied, placeholder, incomplete_pricing, unsupported_price, price_in_scope_text, rule.APPROVAL-SPEND]
